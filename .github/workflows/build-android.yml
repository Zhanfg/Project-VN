name: Build Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBGAL_COMMIT: d0318e6c4cdb8b04bb5d891f40368cff3c6efc85
  WEBGAL_ANDROID_COMMIT: 07fb190d61d1aa496a6045a5e6c00506cb6954f5
  KATEX_VERSION: 0.18.7
  APP_NAME: 放学后
  APPLICATION_ID: io.github.zhanfg.afterschool

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fetch pinned WebGAL 4.6.5
        shell: bash
        run: |
          set -euxo pipefail
          git init .webgal
          git -C .webgal remote add origin https://github.com/OpenWebGAL/WebGAL.git
          git -C .webgal fetch --depth=1 origin "${WEBGAL_COMMIT}"
          git -C .webgal checkout --detach FETCH_HEAD

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Prepare offline math runtime
        shell: bash
        run: |
          set -euxo pipefail

          # Apply our deterministic WebGAL extension against the pinned upstream commit.
          node tools/patch-webgal-math.mjs .webgal

          # Fetch an exact KaTeX release only at build time, then bundle all runtime
          # JS/CSS/fonts into the game so the APK never depends on a CDN.
          rm -rf .vendor game/vendor/katex
          mkdir -p .vendor/katex game/vendor/katex
          KATEX_TGZ="$(npm pack "katex@${KATEX_VERSION}" --pack-destination .vendor | tail -n 1)"
          tar -xzf ".vendor/${KATEX_TGZ}" -C .vendor/katex --strip-components=1

          cp .vendor/katex/dist/katex.min.js game/vendor/katex/
          cp .vendor/katex/dist/katex.min.css game/vendor/katex/
          cp -a .vendor/katex/dist/fonts game/vendor/katex/

          node tools/validate-math.mjs .vendor/katex/dist/katex.mjs game/scene

      - name: Build WebGAL
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .webgal/packages/webgal/public/game
          cp -a game .webgal/packages/webgal/public/game
          npm install --global yarn@1.22.22
          cd .webgal
          yarn install --frozen-lockfile
          yarn build-ci
          test -f packages/webgal/dist/index.html
          test -f packages/webgal/dist/game/vendor/katex/katex.min.js
          test -f packages/webgal/dist/game/vendor/katex/katex.min.css

      - name: Fetch pinned WebGAL Android template
        shell: bash
        run: |
          set -euxo pipefail
          git init .android
          git -C .android remote add origin https://github.com/OpenWebGAL/WebGAL-Android.git
          git -C .android fetch --depth=1 origin "${WEBGAL_ANDROID_COMMIT}"
          git -C .android checkout --detach FETCH_HEAD

      - name: Prepare Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .android/app/src/main/assets/webgal
          mkdir -p .android/app/src/main/assets/webgal
          cp -a .webgal/packages/webgal/dist/. .android/app/src/main/assets/webgal/

          # Keep the Android template namespace aligned with its source packages.
          # Only applicationId changes the install identity.
          sed -i "s/applicationId \"com.openwebgal.demo\"/applicationId \"${APPLICATION_ID}\"/" .android/app/build.gradle
          sed -i "s#<string name=\"app_name\">WebGAL</string>#<string name=\"app_name\">${APP_NAME}</string>#" .android/app/src/main/res/values/strings.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            .android/**/*.gradle
            .android/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd .android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AfterSchool-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AfterSchool-debug-apk
          path: AfterSchool-debug.apk
          if-no-files-found: error
          retention-days: 14
