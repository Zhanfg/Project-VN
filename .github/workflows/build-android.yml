name: Build Android APK

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  WEBGAL_COMMIT: d0318e6c4cdb8b04bb5d891f40368cff3c6efc85
  WEBGAL_ANDROID_COMMIT: 07fb190d61d1aa496a6045a5e6c00506cb6954f5
  APP_NAME: Project VN
  APPLICATION_ID: io.github.zhanfg.projectvn

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Fetch pinned WebGAL 4.6.5
        shell: bash
        run: |
          set -euxo pipefail
          git init .webgal
          git -C .webgal remote add origin https://github.com/OpenWebGAL/WebGAL.git
          git -C .webgal fetch --depth=1 origin "${WEBGAL_COMMIT}"
          git -C .webgal checkout --detach FETCH_HEAD

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build WebGAL
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .webgal/packages/webgal/public/game
          cp -a game .webgal/packages/webgal/public/game
          npm install --global yarn@1.22.22
          cd .webgal
          yarn install --frozen-lockfile
          yarn build-ci
          test -f packages/webgal/dist/index.html

      - name: Fetch pinned WebGAL Android template
        shell: bash
        run: |
          set -euxo pipefail
          git init .android
          git -C .android remote add origin https://github.com/OpenWebGAL/WebGAL-Android.git
          git -C .android fetch --depth=1 origin "${WEBGAL_ANDROID_COMMIT}"
          git -C .android checkout --detach FETCH_HEAD

      - name: Prepare Android project
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .android/app/src/main/assets/webgal
          mkdir -p .android/app/src/main/assets/webgal
          cp -a .webgal/packages/webgal/dist/. .android/app/src/main/assets/webgal/

          sed -i "s/namespace 'com.openwebgal.demo'/namespace '${APPLICATION_ID}'/" .android/app/build.gradle
          sed -i "s/applicationId \"com.openwebgal.demo\"/applicationId \"${APPLICATION_ID}\"/" .android/app/build.gradle
          sed -i "s#<string name=\"app_name\">WebGAL</string>#<string name=\"app_name\">${APP_NAME}</string>#" .android/app/src/main/res/values/strings.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            .android/**/*.gradle
            .android/gradle/wrapper/gradle-wrapper.properties

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          cd .android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Project-VN-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Project-VN-debug-apk
          path: Project-VN-debug.apk
          if-no-files-found: error
          retention-days: 14
